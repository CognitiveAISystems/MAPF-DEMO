<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050b13" />
    <title>MAPF demos · Cognitive AI Systems</title>
    <style>
      :root { color-scheme: dark; background: #050b13; color: #e7f5ff; font-family: Inter, system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; }
      main { width: min(600px, calc(100% - 40px)); padding: 32px 0; }
      h1 { margin-top: 0; }
      nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(235px, 100%), 1fr)); gap: 12px; }
      a { display: block; padding: 18px; border: 1px solid #1b394b; border-radius: 10px; background: #0a1825; color: inherit; text-decoration: none; }
      a:hover, a:focus-visible { border-color: #5ce1ff; }
      a small { display: block; margin-top: 7px; color: #a3c1d1; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <h1>MAPF demos</h1>
      <nav aria-label="Demos">
        <a href="./DMM/"><strong>DMM-Demo</strong><small>Interactive warehouse and agent communication.</small></a>
        <a href="./EPIBT/"><strong>EPIBT-Demo</strong><small>Warehouse routing with oriented agents.</small></a>
      </nav>
    </main>
  </body>
</html>
